<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love 🎂✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #3a0ca3 0%, #0f051d 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
        }

        /* 3D Floating Hearts & Stars */
        .bg-element {
            position: absolute;
            color: rgba(255, 117, 143, 0.7);
            filter: drop-shadow(0 0 8px #ff758f);
            animation: floatUp 4s linear infinite;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.3) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }

        /* Container */
        .box-wrapper {
            text-align: center;
            z-index: 2;
        }

        /* Cake & Candle Style */
        .cake-container {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
            display: inline-block;
        }
        .cake-container:hover {
            transform: scale(1.1);
        }

        .candle-flame {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            animation: flicker 0.6s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 1; filter: drop-shadow(0 0 8px #ffb703); }
            100% { opacity: 0.6; filter: drop-shadow(0 0 2px #ffb703); }
        }

        /* Open Button */
        .action-btn {
            margin-top: 25px;
            padding: 14px 32px;
            background: linear-gradient(45deg, #ff4d6d, #7209b7);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            cursor: pointer;
            transition: 0.3s;
        }
        .action-btn:hover {
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.9);
            transform: scale(1.05);
        }

        /* Letter Modal */
        .letter-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(247, 37, 133, 0.8);
            text-align: center;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .letter-card.active {
            transform: translate(-50%, -50%) scale(1);
        }
        .letter-card h2 {
            color: #7209b7;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .letter-card p {
            color: #333;
            font-size: 16px;
            line-height: 1.8;
            min-height: 120px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="box-wrapper" id="mainBox">
        <div class="cake-container" onclick="blowCandle()">
            <div class="candle-flame" id="flame">🔥</div>
            🎂
        </div>
        <br>
        <button class="action-btn" id="btnText" onclick="blowCandle()">🕯️ กดเพื่อเป่าเทียนวันเกิด 🕯️</button>
    </div>

    <div class="letter-card" id="letterCard">
        <div style="font-size: 40px; margin-bottom: 10px;">🎁💖</div>
        <h2>Happy Birthday นะครับ!</h2>
        <p id="typedText"></p>
    </div>

    <script>
        // สร้างเอฟเฟกต์ดาวและหัวใจลอยขึ้น
        function createElements() {
            const icons = ['❤️', '✨', '🎂', '🎉', '💖'];
            for(let i = 0; i < 30; i++) {
                let el = document.createElement('div');
                el.className = 'bg-element';
                el.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (Math.random() * 20 + 15) + 'px';
                el.style.animationDuration = (Math.random() * 3 + 3) + 's';
                el.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(el);
            }
        }
        createElements();

        // ข้อความอวยพรวันเกิด (เปลี่ยนคำตรงนี้ได้เลย)
        const message = "สุขสันต์วันเกิดนะคนเก่งของเค้า! 🎂✨ ขอให้ปีนี้เป็นปีที่มีแต่ความสุข ยิ้มเยอะๆ สุขภาพแข็งแรง คิดหวังสิ่งไหนก็ขอให้สมปรารถนาน้าา ขอบคุณที่เกิดมาให้เค้าได้รัก และขอบคุณที่เป็นความสดใสในทุกๆ วัน อยู่ฉลองวันเกิดด้วยกันแบบนี้ไปทุกๆ ปีเลยนะ รักที่สุดเยยยยย 🥰❤️";
        
        let index = 0;
        function typeWriter() {
            if (index < message.length) {
                document.getElementById("typedText").innerHTML += message.charAt(index);
                index++;
                setTimeout(typeWriter, 45);
            }
        }

        // เสียงทำนองเพลง Happy Birthday แบบสังเคราะห์ (ไม่ใช้ไฟล์ภายนอก)
        function playHBDMusic() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [
                {f: 264, d: 0.3}, {f: 264, d: 0.3}, {f: 297, d: 0.6}, {f: 264, d: 0.6}, {f: 352, d: 0.6}, {f: 330, d: 1.2},
                {f: 264, d: 0.3}, {f: 264, d: 0.3}, {f: 297, d: 0.6}, {f: 264, d: 0.6}, {f: 396, d: 0.6}, {f: 352, d: 1.2}
            ];
            let time = ctx.currentTime;
            notes.forEach(note => {
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.frequency.value = note.f;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(time);
                gain.gain.setValueAtTime(0.2, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + note.d);
                osc.stop(time + note.d);
                time += note.d;
            });
        }

        // ฟังก์ชันเมื่อกดเป่าเทียน
        function blowCandle() {
            // ดับไฟเทียน
            document.getElementById('flame').style.display = 'none';
            document.getElementById('mainBox').style.opacity = '0.3';

            // เล่นเสียงเพลงวันเกิด
            playHBDMusic();

            // จุดพลุกระดาษฉลองวันเกิดสุดอลังการ
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });

            // แสดงการ์ดอวยพร
            setTimeout(() => {
                document.getElementById('letterCard').classList.add('active');
                typeWriter();
            }, 800);
        }
    </script>
</body>
</html>
